[package]
name = "slate-music"
version = "1.0.1"
description = "Offline local music player"
authors = ["SPARTANAC95"]
edition = "2021"
license = "MIT"

[lib]
name = "slate_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = {version="1", features= ["derive"] }
serde_json = "1"
rusqlite = {version="0.37", features= ["bundled"] }
lofty = "0.22"
rodio = {version="0.21.1", default-features=false, features= ["playback", "symphonia-all"] }
notify = "8"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
rfd = "0.15"
souvlaki = "0.8"
reqwest = {version="0.12", default-features=false, features= ["json", "rustls-tls", "blocking"] }
url = "2"
open = "5"
chrono = "0.4"
image = {version="0.25",default-features=false,features= ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features= ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
hound = "3.5"

[profile.release]
opt-level = 2
strip = true
