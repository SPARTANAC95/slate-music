name: Signed Windows release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source tag or branch to build (blank uses the selected workflow ref)'
        required: false
        type: string
      verify_only:
        description: 'Build and sign verification artifacts without publishing a new release'
        required: true
        default: true
        type: boolean
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Check source before packaging
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) { $changes; git diff --stat; throw 'Build preparation changed the checked-out source.' }
      - name: Build and sign Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --ci -- --locked
      - name: Prepare verified update manifest
        env:
          SLATE_RELEASE_DIR: release-artifacts
        run: |
          git status --porcelain
          git diff --stat
          node tools/release.mjs prepare
      - name: Preserve signed build diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: slate-music-build-diagnostics
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: ignore
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slate-music-windows
          path: release-artifacts/*
      - name: Publish installer and update manifest
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $head = git rev-parse HEAD
          $tagCommit = git rev-parse "$tag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $head -ne $tagCommit) { throw 'The version tag must point to the exact built source commit.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Never overwrite a released updater artifact.' }
          gh release create $tag release-artifacts/*.exe release-artifacts/*.sig release-artifacts/latest.json release-artifacts/SHA256SUMS.txt --title "Slate Music $version" --notes-file "docs/releases/$tag.md" --verify-tag
      - name: Record verification result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "Signed Windows build for $version passed. Download the slate-music-windows workflow artifact for verification. Existing releases were preserved." >> $env:GITHUB_STEP_SUMMARY
