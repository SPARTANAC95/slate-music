name: Signed Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build and sign Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:app
      - name: Prepare verified update manifest
        env:
          SLATE_RELEASE_DIR: release-artifacts
        run: node tools/release.mjs prepare
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slate-music-windows
          path: release-artifacts/*
      - name: Publish installer and update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Never overwrite a released updater artifact.' }
          gh release create $tag release-artifacts/*.exe release-artifacts/*.sig release-artifacts/latest.json release-artifacts/SHA256SUMS.txt --title "Slate Music $version" --notes-file "docs/releases/$tag.md" --verify-tag
